    <div>
      <pf-page-head title="Pharmacies à proximité" sub="Localisez les officines partenaires autour de vous."/>
      <div class="pf-cols">
        <pf-card title="Carte" sub="Cliquez sur une officine">
          <div class="pf-map">
            @for (p of pharmacies(); track p.id) {
              <button class="pf-mappin" [style.left.%]="p.lng" [style.top.%]="p.lat" (click)="sel.set(p.id)">
                <span class="pf-mapdot" [class.on]="sel() === p.id"></span>
              </button>
            }
            <span class="pf-mappin me">
              <span class="pf-mapdot me"></span>
            </span>
            <div class="pf-maplegend">
              <div><span class="dot green"></span> Officine partenaire</div>
              <div><span class="dot blue"></span> Votre position</div>
            </div>
          </div>
        </pf-card>
        <pf-card title="Officines" [sub]="pharmacies().length + ' à proximité'">
          @for (p of pharmacies(); track p.id) {
            <div class="pf-li pf-pharm" [class.on]="sel() === p.id" (click)="sel.set(p.id)">
              <span class="pf-liic"><nv-icon name="pin" [size]="18"/></span>
              <div class="pf-libody"><strong>{{ p.nom }}</strong><span>{{ p.ville }} · {{ p.horaires }}</span></div>
              <span class="chip chip-gray">{{ p.dist }}</span>
            </div>
          }
        </pf-card>
      </div>
    </div>
