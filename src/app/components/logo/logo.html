    <button (click)="clicked.emit()" class="nv-logo" style="display:flex;align-items:center;gap:10px">
      <span style="width:38px;height:38px;border-radius:11px;background:var(--blue);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,51,102,.22)">
        <nv-icon name="pill" [size]="21" color="var(--green)" [sw]="2.1"/>
      </span>
      <span style="display:flex;flex-direction:column;line-height:1">
        <span style="font-family:'Montserrat';font-weight:800;font-size:18px;letter-spacing:-.02em"
              [style.color]="light() ? '#fff' : 'var(--blue)'">XamSa<span style="color:var(--green)">Med</span></span>
        <span style="font-family:'Open Sans';font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:3px"
              [style.color]="light() ? 'rgba(255,255,255,.6)' : 'var(--gray-text)'">Accès médicaments</span>
      </span>
    </button>
